<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>News | Grain6888</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
    <header class="github-header">
        <div class="github-header-inner">
            <img src="https://github.com/Grain6888.png" alt="Grain6888's GitHub Profile Picture" class="github-avatar">
            <div class="github-title-group">
                <h1 class="github-site-title">Grain6888</h1>
                <p class="github-site-subtitle">News & Highlights</p>
            </div>
        </div>
    </header>

    <main class="github-main">
        <section class="news-section">
            <div class="news-section-header">
                <h2 class="section-title">News</h2>
                <div class="news-controls">
                    <label for="sort-order">Sort:</label>
                    <select id="sort-order">
                        <option value="desc">Newest first</option>
                        <option value="asc">Oldest first</option>
                    </select>
                </div>
            </div>
            <!-- JSONから自動生成 -->
            <div id="news-container"></div>
        </section>
    </main>

    <footer class="github-footer">
        <p class="footer-text">
            © <span id="year"></span> Grain6888 · Styled in the spirit of GitHub
        </p>
    </footer>

    <script src="assets/news.js"></script>
    <script src="assets/favicon.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>

<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Grain6888</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Assets/styles.css" />
    <!-- MarkdownをHTMLに変換する軽量パーサー -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <header class="github-header">
        <div class="github-header-inner">
            <!-- ヘッダーアイコンをGitHubリンクに変更 -->
            <a href="https://github.com/Grain6888/" target="_blank" rel="noopener noreferrer">
                <img src="https://github.com/Grain6888.png" alt="Grain6888's GitHub Profile Picture"
                    class="github-avatar">
            </a>
            <div class="github-title-group">
                <h1 class="github-site-title">Grain6888</h1>
                <p class="github-site-subtitle">Tips & News</p>
            </div>
        </div>

        <!-- タブナビゲーション（アイコン無し） -->
        <nav class="github-tabs">
            <div class="tabs-inner">
                <button class="tab-btn active" data-tab="tips">Tips</button>
                <button class="tab-btn" data-tab="news">News</button>
            </div>
        </nav>
    </header>

    <main class="github-main">
        <!-- Tips タブのコンテンツ -->
        <div id="tips-content" class="tab-pane active">
            <div class="tips-layout">
                <!-- 左側：記事リストのサイドバー -->
                <aside class="tips-sidebar">
                    <h3 class="sidebar-title">Articles</h3>
                    <ul id="tips-list-container" class="tips-list">
                        <!-- ここに自動で記事リストが生成されます -->
                    </ul>
                </aside>

                <!-- 右側：記事本文表示エリア -->
                <article class="tips-viewer">
                    <div id="tips-body" class="markdown-body">
                        <p style="color: var(--text-muted);">Loading article...</p>
                    </div>
                </article>
            </div>
        </div>

        <!-- News タブのコンテンツ -->
        <div id="news-content" class="tab-pane">
            <section class="news-section">
                <div class="news-section-header">
                    <h2 class="section-title">News</h2>
                    <div class="news-controls">
                        <label for="sort-order">Sort:</label>
                        <select id="sort-order">
                            <option value="desc">Newest first</option>
                            <option value="asc">Oldest first</option>
                        </select>
                    </div>
                </div>
                <!-- JSONから自動生成 -->
                <div id="news-container"></div>
            </section>
        </div>
    </main>

    <footer class="github-footer">
        <p class="footer-text">
            © <span id="year"></span> Grain6888 · Styled in the spirit of GitHub
        </p>
    </footer>

    <script src="Assets/news.js"></script>
    <script src="Assets/favicon.js"></script>
    <script src="Assets/tips.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // タブ切り替えロジック
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(`${btn.dataset.tab}-content`).classList.add('active');
            });
        });
    </script>
</body>

</html>
